<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --surface-2: #f0efec;
    --ink: #1b1917;
    --muted: #78746e;
    --line: #e4e1db;
    --accent: #0e7a5f;
    --accent-soft: rgba(14,122,95,.12);
    --danger: #b4442e;
    --shadow: 0 1px 2px rgba(27,25,23,.05), 0 8px 24px rgba(27,25,23,.06);
    --radius: 14px;
    --font: "Avenir Next","Segoe UI Variable","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  }
  [data-theme="dark"] {
    --bg: #121316;
    --surface: #1b1c20;
    --surface-2: #232428;
    --ink: #eceae5;
    --muted: #8f8d88;
    --line: #2c2d33;
    --accent: #2fbf9b;
    --accent-soft: rgba(47,191,155,.14);
    --danger: #e07a5f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: clamp(20px, 5vh, 56px) 16px 96px;
    transition: background .3s ease, color .3s ease;
    text-wrap: pretty;
  }
  .app { width: 100%; max-width: 560px; }

  /* ── Header ─────────────────────────────── */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: clamp(26px, 4.5vw, 32px);
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.1;
  }
  .count {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .count b { color: var(--accent); font-weight: 600; }
  .theme-btn {
    flex: none;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 50%;
    cursor: pointer;
    color: var(--ink);
    transition: background .2s, border-color .2s;
  }
  .theme-btn:hover { background: var(--surface-2); }
  .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-btn svg { width: 18px; height: 18px; }
  [data-theme="dark"] .icon-sun { display: block; }
  [data-theme="dark"] .icon-moon { display: none; }
  .icon-sun { display: none; }

  .progress {
    height: 3px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress > div {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: inherit;
    transition: width .45s cubic-bezier(.2,.8,.2,1);
  }

  /* ── Input row ──────────────────────────── */
  .add-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .add-row input {
    flex: 1;
    min-height: 48px;
    padding: 0 16px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: border-color .2s, box-shadow .2s;
  }
  .add-row input::placeholder { color: var(--muted); }
  .add-row input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow);
  }
  .add-row button {
    flex: none;
    width: 48px; height: 48px;
    display: grid; place-items: center;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: transform .15s ease, filter .15s ease;
    box-shadow: var(--shadow);
  }
  .add-row button:hover { filter: brightness(1.08); }
  .add-row button:active { transform: scale(.94); }
  .add-row button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .add-row button svg { width: 20px; height: 20px; }

  /* ── Filters ─────────────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .tabs {
    display: inline-flex;
    padding: 3px;
    background: var(--surface-2);
    border-radius: 99px;
    gap: 2px;
  }
  .tabs button {
    border: none;
    background: transparent;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    padding: 7px 14px;
    min-height: 34px;
    border-radius: 99px;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(27,25,23,.1);
  }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .clear-done {
    border: none;
    background: none;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    padding: 8px 10px;
    min-height: 34px;
    border-radius: 8px;
    cursor: pointer;
    transition: color .2s, background .2s;
  }
  .clear-done:hover:not(:disabled) { color: var(--danger); background: var(--surface-2); }
  .clear-done:disabled { opacity: .45; cursor: default; }
  .clear-done:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ── List ───────────────────────────────── */
  ul.list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li.item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--shadow);
    animation: enter .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes enter {
    from { opacity: 0; transform: translateY(-6px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  li.item.leaving {
    animation: leave .22s ease forwards;
  }
  @keyframes leave {
    to { opacity: 0; transform: translateX(24px) scale(.98); }
  }
  @media (prefers-reduced-motion: reduce) {
    li.item, li.item.leaving { animation: none; }
    .progress > div { transition: none; }
  }

  .check {
    flex: none;
    width: 24px; height: 24px;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .check input {
    position: absolute;
    opacity: 0;
    width: 24px; height: 24px;
    cursor: pointer;
  }
  .box {
    width: 22px; height: 22px;
    border: 2px solid var(--line);
    border-radius: 7px;
    display: grid; place-items: center;
    transition: background .18s ease, border-color .18s ease, transform .12s ease;
  }
  .check:active .box { transform: scale(.88); }
  .box svg { width: 13px; height: 10px; opacity: 0; }
  .box svg path {
    stroke: #fff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 16;
    stroke-dashoffset: 16;
    transition: stroke-dashoffset .2s ease .05s;
  }
  .check input:checked + .box {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check input:checked + .box svg { opacity: 1; }
  .check input:checked + .box svg path { stroke-dashoffset: 0; }
  .check input:focus-visible + .box {
    box-shadow: 0 0 0 3px var(--accent-soft);
    border-color: var(--accent);
  }

  .label {
    flex: 1;
    font-size: 15px;
    line-height: 1.35;
    word-break: break-word;
    background: linear-gradient(var(--accent), var(--accent)) left center / 0% 2px no-repeat;
    transition: background-size .3s ease, color .3s ease;
  }
  li.done .label {
    color: var(--muted);
    background-size: 100% 2px;
  }
  .del {
    flex: none;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: none;
    background: transparent;
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    opacity: 0;
    transition: background .15s, color .15s, opacity .15s;
  }
  li.item:hover .del, li.item:focus-within .del, li.item .del:focus-visible { opacity: 1; }
  @media (hover: none) { .del { opacity: .8; } }
  .del:hover { background: var(--accent-soft); color: var(--danger); }
  .del svg { width: 16px; height: 16px; }

  /* ── Empty state ────────────────────────── */
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 48px 16px;
    font-size: 14px;
    line-height: 1.6;
  }
  .empty strong {
    display: block;
    color: var(--ink);
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  /* ── Toast ──────────────────────────────── */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 16px);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--ink);
    color: var(--bg);
    padding: 12px 12px 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s cubic-bezier(.2,.8,.2,1);
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button {
    border: none;
    background: var(--accent-soft);
    color: var(--accent);
    font: inherit;
    font-weight: 600;
    padding: 7px 14px;
    min-height: 34px;
    border-radius: 8px;
    cursor: pointer;
  }
  .toast button:hover { filter: brightness(1.1); }

  footer.hint {
    margin-top: 26px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .01em;
  }
  footer.hint kbd {
    font: inherit;
    font-size: 11px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 6px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Tasks</h1>
      <p class="count" id="count">0 tasks</p>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="progress" aria-hidden="true"><div id="bar"></div></div>

  <form class="add-row" id="addForm">
    <input id="input" type="text" autocomplete="off" placeholder="What needs doing?" aria-label="New task" autofocus>
    <button type="submit" aria-label="Add task">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>

  <div class="toolbar">
    <div class="tabs" role="group" aria-label="Filter tasks">
      <button data-filter="all" aria-pressed="true">All</button>
      <button data-filter="active" aria-pressed="false">Active</button>
      <button data-filter="done" aria-pressed="false">Done</button>
    </div>
    <button class="clear-done" id="clearDone" disabled>Clear done</button>
  </div>

  <ul class="list" id="list"></ul>

  <div class="empty" id="empty" hidden>
    <strong id="emptyTitle">All clear</strong>
    <span id="emptyBody">Tasks you add will appear here.</span>
  </div>

  <footer class="hint"><kbd>N</kbd> new task &nbsp;·&nbsp; <kbd>Enter</kbd> add &nbsp;·&nbsp; saved locally in your browser</footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button id="toastUndo">Undo</button>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const list = $('#list'), input = $('#input'), empty = $('#empty');
  const store = 'tasks.v1';
  let tasks = JSON.parse(localStorage.getItem(store) || '[]');
  let filter = 'all';
  let toastTimer, undoSnapshot = null;

  const persist = () => localStorage.setItem(store, JSON.stringify(tasks));

  function itemEl(t) {
    const li = document.createElement('li');
    li.className = 'item' + (t.done ? ' done' : '');
    li.dataset.id = t.id;
    li.innerHTML = `
      <label class="check">
        <input type="checkbox" ${t.done ? 'checked' : ''} aria-label="Mark done: ${t.text.replace(/</g,'&lt;')}">
        <span class="box"><svg viewBox="0 0 14 11"><path d="M1.5 5.5 5 9 12.5 1.5"/></svg></span>
      </label>
      <span class="label"></span>
      <button class="del" aria-label="Delete task">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 .8 12a1 1 0 0 0 1 .9h6.4a1 1 0 0 0 1-.9L17 7"/></svg>
      </button>`;
    li.querySelector('.label').textContent = t.text;
    li.querySelector('input').addEventListener('change', e => {
      t.done = e.target.checked;
      li.classList.toggle('done', t.done);
      persist(); refresh();
    });
    li.querySelector('.del').addEventListener('click', () => {
      const idx = tasks.indexOf(t);
      undoSnapshot = { tasks: tasks.slice(), idx };
      tasks.splice(idx, 1);
      li.classList.add('leaving');
      setTimeout(() => { persist(); refresh(); }, 220);
      showToast('Task deleted');
      refresh();
    });
    return li;
  }

  function refresh() {
    const shown = tasks.filter(t =>
      filter === 'all' ? true : filter === 'active' ? !t.done : t.done);
    list.innerHTML = '';
    shown.forEach(t => list.appendChild(itemEl(t)));
    empty.hidden = shown.length > 0;
    if (empty.hidden === false) {
      if (tasks.length === 0) {
        $('#emptyTitle').textContent = 'All clear';
        $('#emptyBody').textContent = 'Add your first task above.';
      } else {
        $('#emptyTitle').textContent = filter === 'done' ? 'Nothing done yet' : 'Everything is done';
        $('#emptyBody').textContent = filter === 'done'
          ? 'Tick tasks and they’ll show up here.'
          : 'Nice work. Add more above when you’re ready.';
      }
    }
    const total = tasks.length, done = tasks.filter(t => t.done).length;
    const active = total - done;
    $('#count').innerHTML = total === 0
      ? 'No tasks yet'
      : `<b>${done}</b> of ${total} done · ${active} left`;
    $('#bar').style.width = total ? (done / total * 100) + '%' : '0%';
    $('#clearDone').disabled = done === 0;
  }

  function showToast(msg) {
    undoSnapshot !== null ? $('#toastUndo').style.display = '' : $('#toastUndo').style.display = 'none';
    $('#toastMsg').textContent = msg;
    const t = $('#toast');
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.classList.remove('show'); undoSnapshot = null; }, 4500);
  }

  $('#toastUndo').addEventListener('click', () => {
    if (undoSnapshot) {
      tasks = undoSnapshot.tasks;
      undoSnapshot = null;
      persist(); refresh();
    }
    $('#toast').classList.remove('show');
  });

  $('#addForm').addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: crypto.randomUUID(), text, done: false });
    input.value = '';
    persist(); refresh();
    input.focus();
  });

  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.tabs button').forEach(b =>
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
      refresh();
    });
  });

  $('#clearDone').addEventListener('click', () => {
    undoSnapshot = { tasks: tasks.slice() };
    tasks = tasks.filter(t => !t.done);
    persist(); refresh();
    showToast('Completed tasks cleared');
  });

  document.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'n' && document.activeElement !== input) {
      e.preventDefault(); input.focus();
    }
  });

  // theme
  const themeBtn = $('#themeBtn');
  const savedTheme = localStorage.getItem('tasks.theme');
  const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
  themeBtn.addEventListener('click', () =>
    setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    localStorage.setItem('tasks.theme', t);
  }

  refresh();
})();
</script>
</body>
</html>
